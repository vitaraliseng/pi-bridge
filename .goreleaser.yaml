# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: pi-bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pi-bridge
    main: ./cmd/pi-bridge
    binary: pi-bridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

# Publishes a Homebrew formula to vitaraliseng/homebrew-tap on release.
# Requires secret HOMEBREW_TAP_TOKEN (PAT with repo scope on the tap).
# Until the tap + secret exist, the release job still publishes GitHub binaries.
brews:
  - name: pi-bridge
    repository:
      owner: vitaraliseng
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/vitaraliseng/pi-bridge
    description: Discord front-end for the pi coding agent
    license: MIT
    install: |
      bin.install "pi-bridge"
    test: |
      assert_match "pi-bridge", shell_output("#{bin}/pi-bridge help")
    # Skip brew push if token missing (binary release still succeeds).
    skip_upload: auto

# Ubuntu/Debian packages (linux only). Install: sudo dpkg -i pi-bridge_*.deb
nfpms:
  - id: deb
    package_name: pi-bridge
    file_name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else }}{{ .Arch }}{{ end }}
    homepage: https://github.com/vitaraliseng/pi-bridge
    maintainer: Cabe Waldrop <cabe.waldrop1985@gmail.com>
    description: Discord front-end for the pi coding agent
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: deploy/pi-bridge.service
        dst: /usr/lib/systemd/user/pi-bridge.service
        type: config|noreplace

release:
  github:
    owner: vitaraliseng
    name: pi-bridge
  draft: false
  prerelease: auto
